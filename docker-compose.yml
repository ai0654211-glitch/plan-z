version: '3.8'

services:
  # قاعدة البيانات
  mongodb:
    image: mongo:6.0
    container_name: planz_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: planZ_ecommerce
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - planz_network

  # السيرفر الخلفي
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planz_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/planZ_ecommerce?authSource=admin
      JWT_SECRET: your_production_jwt_secret
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - planz_network
    restart: unless-stopped

  # الواجهة الأمامية
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planz_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - planz_network
    restart: unless-stopped

  # Nginx كـ reverse proxy
  nginx:
    image: nginx:alpine
    container_name: planz_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - planz_network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  planz_network:
    driver: bridge